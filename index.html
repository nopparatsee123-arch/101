<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกและเก็บข้อมูล</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 800px;
      background: #ffffff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #218838;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 25px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #007bff;
      color: white;
    }
    tr:hover {
      background-color: #f1f1f1;
    }
    .btn-delete {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      width: auto;
    }
    .btn-delete:hover {
      background-color: #c82333;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>📝 ระบบบันทึกข้อมูล</h2>
    
    <form id="dataForm">
      <div class="form-group">
        <label for="title">ชื่อรายการ / หัวข้อ:</label>
        <input type="text" id="title" placeholder="เช่น ซื้ออุปกรณ์คอมพิวเตอร์" required>
      </div>

      <div class="form-group">
        <label for="category">หมวดหมู่:</label>
        <select id="category">
          <option value="ทั่วไป">ทั่วไป</option>
          <option value="การเงิน">การเงิน</option>
          <option value="การเรียน/งาน">การเรียน/งาน</option>
          <option value="ส่วนตัว">ส่วนตัว</option>
        </select>
      </div>

      <div class="form-group">
        <label for="note">รายละเอียดเพิ่มเติม:</label>
        <input type="text" id="note" placeholder="กรอกรายละเอียด (ถ้ามี)">
      </div>

      <button type="submit">💾 บันทึกข้อมูล</button>
    </form>

    <hr style="margin-top: 30px; border: 0; border-top: 1px solid #eee;">

    <h2>📋 รายการที่บันทึกไว้</h2>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>รายการ</th>
          <th>หมวดหมู่</th>
          <th>รายละเอียด</th>
          <th>จัดการ</th>
        </tr>
      </thead>
      <tbody id="dataTable">
        <!-- ข้อมูลจะถูกโหลดมาแสดงที่นี่ -->
      </tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById('dataForm');
    const tableBody = document.getElementById('dataTable');

    // โหลดข้อมูลจาก LocalStorage เมื่อเปิดหน้าเว็บ
    document.addEventListener('DOMContentLoaded', displayData);

    // เมื่อกดปุ่มบันทึก
    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const note = document.getElementById('note').value;

      const newItem = {
        id: Date.now(),
        title: title,
        category: category,
        note: note
      };

      saveToLocalStorage(newItem);
      displayData();
      form.reset();
    });

    // ฟังก์ชันบันทึกลง LocalStorage
    function saveToLocalStorage(item) {
      let items = getItemsFromStorage();
      items.push(item);
      localStorage.setItem('myWebData', JSON.stringify(items));
    }

    // ฟังก์ชันดึงข้อมูล
    function getItemsFromStorage() {
      let items = localStorage.getItem('myWebData');
      return items ? JSON.parse(items) : [];
    }

    // ฟังก์ชันแสดงผลบนตาราง
    function displayData() {
      const items = getItemsFromStorage();
      tableBody.innerHTML = '';

      if (items.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#888;">ยังไม่มีข้อมูลที่บันทึกไว้</td></tr>`;
        return;
      }

      items.forEach((item, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${index + 1}</td>
          <td>${item.title}</td>
          <td>${item.category}</td>
          <td>${item.note || '-'}</td>
          <td>
            <button class="btn-delete" onclick="deleteItem(${item.id})">ลบ</button>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    // ฟังก์ชันลบข้อมูล
    function deleteItem(id) {
      let items = getItemsFromStorage();
      items = items.filter(item => item.id !== id);
      localStorage.setItem('myWebData', JSON.stringify(items));
      displayData();
    }
  </script>

</body>
</html>
